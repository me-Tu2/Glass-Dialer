name: Build Glass Dialer APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Setup Local Properties
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "storeFile=${{ github.workspace }}/debug.keystore" >> local.properties
          echo "storePassword=android" >> local.properties
          echo "keyAlias=androiddebugkey" >> local.properties
          echo "keyPassword=android" >> local.properties

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Glass-Dialer-Debug-APK
          path: app/build/outputs/apk/**/*.apk
